[workspace]
members = [
  "pulse-common",
  "pulse-drop-tester",
  "pulse-metrics",
  "pulse-promcli",
  "pulse-promloadgen",
  "pulse-protobuf",
  "pulse-proxy",
  "pulse-vrl-tester",
]
resolver = "2"

[workspace.dependencies]
ahash                  = "0.8"
anyhow                 = "1"
assert_matches         = "1.5.0"
async-trait            = "0.1"
aws-config             = "1.12.0"
aws-credential-types   = "1.3.0"
aws-sdk-sqs            = "1.112.0"
aws-sigv4              = "1.6.0"
aws-smithy-async       = "1.3.0"
aws-smithy-http        = "0.64.0"
aws-smithy-runtime-api = { version = "1.17.0", features = ["test-util"] }
aws-smithy-types       = "1.8.0"
axum                   = "0.8.9"
backoff                = { version = "0.4.0", features = ["tokio"] }
base64ct               = "1.8.3"
bd-grpc                = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-grpc-codec          = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-log                 = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-log-util            = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-otlp-metrics        = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-panic               = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-pgv                 = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-proto               = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-proto-util          = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-runtime             = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-runtime-config      = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-server-stats        = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-shutdown            = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-test-helpers        = { git = "https://github.com/bitdriftlabs/shared-core.git" }
bd-time                = { git = "https://github.com/bitdriftlabs/shared-core.git" }
built                  = { version = "0.8", features = ["git2"] }
bytes                  = "1"
cc                     = "1.4.7"
clap                   = { version = "4.6.7", features = ["derive", "env"] }
comfy-table            = "8.0.0"
console-subscriber     = "0.5.0"
criterion              = { version = "0.8", features = ["html_reports"] }
ctor                   = "1.0.13"
cuckoofilter           = "0.5.0"
dashmap                = { version = "6", features = ["raw-api"] }
deadpool               = { version = "0.13", features = ["managed", "rt_tokio_1"] }
event-listener         = "5.4.2"
fst                    = "0.4.7"
futures                = "0.3"
futures-util           = "0.3.34"
gettid                 = "0.1.4"
hashbrown              = "0.17.1"
http                   = "1.5.0"
http-body-util         = "0.1.5"
humantime-serde        = "1.1"
hyper                  = "1.11.1"

hyper-rustls = { version = "0.27.10", default-features = false, features = [
  "http1",
  "http2",
  "webpki-tokio",
  "aws-lc-rs",
] }

hyper-util            = { version = "0.1.20", features = ["client", "client-legacy"] }
hyperloglogplus       = "0.4.1"
intrusive-collections = "0.10.3"
itertools             = "0.15.0"
k8s-openapi           = { version = "0.28.0", features = ["v1_32"] }

kube = { version = "4.2.0", features = [
  "runtime",
  "derive",
  "rustls-tls",
  "client",
], default-features = false }

log               = "0.4"
matches           = "0.1"
memchr            = "2"
mockall           = "0.15.0"
nom               = "8"
notify            = "8.2.0"
parking_lot       = "0.12"
pretty_assertions = "1.4.1"
prometheus        = { version = "0.14", features = ["process"] }
prometheus-parser = { git = "https://github.com/bitdriftlabs/mpl-core" }

protobuf = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack", features = [
  "bytes",
  "with-bytes",
] }
protobuf-codegen = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
protobuf-json-mapping = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }

quickcheck        = "1"
quickcheck_macros = "1"
rand              = { version = "0.10" }
rand_xoshiro      = "0.8"
regex             = "1"

reqwest = { version = "0.13.5", features = ["json"] }

reusable-fmt               = "0.2.0"
rustls                     = "0.23.45"
serde                      = { version = "1", features = ["derive"] }
serde_json                 = "1"
serde_yaml                 = "0.9.34"
snap                       = "1"
socket2                    = "0.6.5"
tempfile                   = "3.27"
thiserror                  = "2"
tikv-jemalloc-ctl          = "0.7.0"
tikv-jemallocator.features = ["profiling", "stats", "unprefixed_malloc_on_supported_platforms"]
tikv-jemallocator.version  = "0.7.0"
time                       = { version = "0.3.55", features = ["formatting"] }
tokio                      = { version = "1", features = ["full", "parking_lot", "tracing", "test-util"] }
tokio-stream               = "0.1.19"
tokio-test                 = "0.4"
topk                       = "0.7.0"
topological-sort           = "0.3.1"
tracing                    = "0.1.44"
unwrap-infallible          = "1.0.0"
url                        = "2.5.8"
uuid                       = { version = "1.26.1", features = ["v4"] }

vrl = { git = "https://github.com/mattklein123/vrl.git", branch = "performance-20260113", default-features = false, features = [
  "compiler",
  "value",
  "diagnostic",
  "path",
  "parser",
  "stdlib",
  "core",
] }

xxhash-rust = { version = "0.8.18", features = ["xxh3", "xxh64"] }
